project: osquery

path: /home/ubuntu/proj

kill-timeout: 60m
warn-timeout: 1m

backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04

environment:
  CONCIERGE: concierge.yaml
  CONCIERGE_EXTRA_SNAPS: ""
  OPCLI_GIT_REF: "v0.0.1-alpha.5"

exclude:
- .git
- .tox
- .venv
- .*_cache

integration-suites:
  tests/integration/:
    summary: OSQuery integration tests
    working-dir: ./
    backends:
    - integration-test
    # spread runs one job per test_*.py module, so the `osctrl` marker isn't
    # needed to split the suites here. Use a CI tox env with no marker filter so
    # every discovered module runs its own tests: test_charm (dummy controller)
    # and test_osctrl (real osctrl in a nested LXD VM; the runner must expose
    # /dev/kvm and reach Docker Hub).
    environment:
      TOX_ENV: integration-ci
    pytest-arguments-template: |
      --model testing
