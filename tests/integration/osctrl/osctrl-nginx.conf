# Trimmed osctrl nginx config: only the TLS terminator for the osquery TLS
# endpoints, forwarding to osctrl-tls. The upstream config also serves an API
# vhost that proxies to the React frontend, which this test stack does not run,
# so that block is intentionally omitted. The test reaches osctrl-api directly.
server {
    listen 443 ssl default deferred;
    server_tokens off;

    ssl_certificate /etc/ssl/certs/osctrl.crt;
    ssl_certificate_key /etc/ssl/private/osctrl.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
    add_header X-Frame-Options DENY;
    add_header Cache-Control "no-cache, no-store";
    add_header Pragma "no-cache";
    expires -1;

    # osctrl-tls osquery endpoints.
    location ~* .(enroll|config|log|init|block|read|write|enroll.sh|enroll.ps1|remove.sh|remove.ps1)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://osctrl-tls:9000;
        proxy_read_timeout 90;
    }
}
