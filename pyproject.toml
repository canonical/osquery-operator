[project]
name = "osquery-operator"
version = "0.1.0"
description = "Subordinate charm for the OSQuery endpoint security monitoring agent."
readme = "README.md"
# Ubuntu 22.04 (one of the supported bases) ships Python 3.10, so the charm must
# remain compatible with it. Keep this in sync with the oldest supported base.
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "ops~=2.17",
  "charmlibs-apt~=1.0",
  "charmlibs-systemd~=1.0",
]

[dependency-groups]
fmt = [
  "ruff",
]
lint = [
  "codespell",
  "jubilant==1.10.0",
  "mypy",
  "pep8-naming",
  "pytest",
  "requests",
  "ruff",
  "types-pyyaml",
  "types-requests",
]
unit = [
  "coverage[toml]",
  "ops[testing]",
  "pytest",
]
coverage-report = [
  "coverage[toml]",
  "pytest",
]
static = [
  "bandit[toml]",
]
integration = [
  "jubilant==1.10.0",
  # opcli requires Python 3.12+; the integration tests run on the 24.04 host,
  # so gate it behind a marker to keep the project's 3.10 floor for the build.
  "opcli @ git+https://github.com/canonical/charm-ci.git@v0.0.1-alpha.5 ; python_version >= '3.12'",
  "pytest",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["A", "B", "C", "CPY", "D", "E", "F", "I", "N", "RUF", "S", "SIM", "TC", "UP", "W"]
ignore = [
  "B904",
  "D107",
  "D203",
  "D204",
  "D205",
  "D213",
  "D215",
  "D400",
  "D404",
  "D406",
  "D407",
  "D408",
  "D409",
  "D413",
  "E501",
  "S105",
  "S603",
  "TC002",
  "TC006",
  "UP006",
  "UP007",
  "UP035",
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "D100", "D101", "D102", "D103", "D104", "D212", "D415", "D417", "S"]

[tool.ruff.lint.flake8-copyright]
author = "Canonical Ltd."
min-file-size = 1
notice-rgx = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,htmlcov,uv.lock,tmp,*/docs/_build/*,*/docs/_dev/*"

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
pythonpath = ["lib", "src"]
markers = [
  "osctrl: integration tests that stand up a real osctrl controller in an LXD VM (requires nested virtualisation and Docker Hub access)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
mypy_path = "lib:src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["/venv/"]

[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]
