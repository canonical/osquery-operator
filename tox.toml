requires = ["tox>=4.21"]
env_list = ["lint", "unit", "static", "coverage-report"]
skipsdist = true

[env_run_base]
runner = "uv-venv-lock-runner"
set_env.PYTHONPATH = "{tox_root}:{tox_root}/lib:{[vars]src_path}"
set_env.PYTHONBREAKPOINT = "ipdb.set_trace"
set_env.PY_COLORS = "1"

[vars]
src_path = "{tox_root}/src/"
tst_path = "{tox_root}/tests/"

[env.fmt]
description = "Apply coding style standards to code"
dependency_groups = ["fmt"]
commands = [
  ["ruff", "check", "--fix", "--select", "I", "src", "tests"],
  ["ruff", "format", "src", "tests"],
]

[env.lint]
description = "Check code against coding style standards"
dependency_groups = ["lint"]
commands = [
  ["codespell", "{tox_root}"],
  ["ruff", "format", "--check", "--diff", "src", "tests"],
  ["ruff", "check", "src", "tests"],
  ["mypy", "src", "tests"],
]

[env.unit]
description = "Run unit tests"
dependency_groups = ["unit"]
commands = [
  ["coverage", "run", "--source={[vars]src_path}", "-m", "pytest", "--ignore={[vars]tst_path}integration", "-v", "--tb", "native", "-s", { replace = "posargs", extend = true }],
  ["coverage", "report"],
]

[env.coverage-report]
description = "Create a coverage report"
dependency_groups = ["coverage-report"]
commands = [["coverage", "report"]]

[env.static]
description = "Run static type checks"
dependency_groups = ["static"]
commands = [["bandit", "-c", "pyproject.toml", "-r", "src", "tests"]]

[env.integration]
description = "Run integration tests"
dependency_groups = ["integration"]
commands = [["pytest", "-v", "--tb", "native", "--ignore={[vars]tst_path}unit", "--log-cli-level=INFO", "-s", { replace = "posargs", extend = true }]]
