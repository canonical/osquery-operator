# Version of the artifact schema
version_schema: 2

# The key holding the change(s)
changes:
- title: Added a Terraform module for deploying the charm
  author: m2-farzan
  type: minor
  description: >
    Added a reusable Terraform module under the terraform/ directory that
    deploys the OSQuery subordinate charm using the Juju Terraform provider.
    The module omits the units directive (as required for subordinate charms)
    and exposes the general-info endpoint so consumers can relate OSQuery to a
    principal machine application. It ships terraform tests that deploy an
    ubuntu principal, integrate the charm and assert it reaches active status.
  urls:
    pr:
      - "https://github.com/canonical/osquery-operator/pull/5"
    related_doc:
      - "https://github.com/canonical/osquery-operator/blob/main/terraform/README.md"
    related_issue:
  visibility: public
  highlight: true
