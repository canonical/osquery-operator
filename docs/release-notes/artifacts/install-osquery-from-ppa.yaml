# Version of the artifact schema
version_schema: 2

# The key holding the change(s)
changes:
- title: Added osquery subordinate charm with PPA-based installation
  author: m2-farzan
  type: minor
  description: >
    Introduced the osquery subordinate machine charm. When related to a
    principal application, the charm installs the Canonical SecOps fork of
    osquery from its Launchpad PPA on the host and reaches active status.
    Removing the unit stops the daemon and uninstalls the package.
  urls:
    pr:
      - "https://github.com/canonical/osquery-operator/pull/1"
    related_doc:
    related_issue:
  visibility: public
  highlight: true
