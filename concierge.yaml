juju:
  channel: 3.6/stable
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

# OSQuery is a machine subordinate charm, so it is exercised on a LXD cloud
# rather than a Kubernetes substrate.
providers:
  lxd:
    enable: true
    bootstrap: true
